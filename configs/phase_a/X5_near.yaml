# Experimento X5_near (Fase A)
experiment:
  name: X5_near
  description: 'Diagnóstico R_near: elimina el término positivo (1 - d/0.30) en d < 0.30 sobre la base X3'
  author: Fase A
  phase: A
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: hold
  hold_steps: 5
  velocity_tolerance: 0.3
  reward_type: x5_near
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.3
    velocity_penalty_near: 0.15
    r_near_mode: none
normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
ppo:
  learning_rate: 0.00015
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  max_grad_norm: 0.5
  num_envs: 4
  net_arch: 256x256_relu
training:
  total_timesteps: 300000
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

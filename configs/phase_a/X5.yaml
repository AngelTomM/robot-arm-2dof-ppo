# Experimento X5 (Fase A)
experiment:
  name: X5
  description: Añade R_vel gaussiana con w_v = 0.1, sigma_v = 0.15 sobre X3
  author: Fase A
  phase: A
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: hold
  hold_steps: 5
  velocity_tolerance: 0.3
  reward_type: x5_vel
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.3
    velocity_penalty_near: 0.15
    w_v: 0.1
    sigma_v: 0.15
normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
ppo:
  batch_size: 64
  clip_range: 0.2
  ent_coef: 0.002
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.00015
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  net_arch: 256x256_relu
  num_envs: 4
training:
  total_timesteps: 300000
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

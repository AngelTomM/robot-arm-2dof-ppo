# Smoke Test PPO (Fase D - LQR MDP)
experiment:
  name: x3_smoke
  description: Smoke test PPO con recompensa Lyapunov / LQR continua (Fase D)
  author: Fase D
  phase: smoke

env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: none
  reward_type: lyapunov_lqr
  reward_params:
    w_pos: 1.0
    w_vel: 0.05
    w_ctrl: 0.01

normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0

ppo:
  learning_rate: 0.00015
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  max_grad_norm: 0.5
  num_envs: 2
  net_arch:
    layers: [128, 128]
    hidden_activation: relu

training:
  total_timesteps: 1000
  checkpoint_freq: 1000

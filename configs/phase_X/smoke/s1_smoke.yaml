# Smoke Test SAC (Fase D - LQR MDP)
experiment:
  name: s1_smoke
  description: Smoke test SAC con recompensa Lyapunov / LQR continua (Fase D)
  author: Fase D
  phase: smoke

env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: none
  reward_type: lyapunov_lqr
  reward_params:
    w_pos: 1.0
    w_vel: 0.05
    w_ctrl: 0.01

normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0

sac:
  learning_rate: 0.0003
  buffer_size: 50000
  learning_starts: 100
  batch_size: 64
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch:
    layers: [128, 128]
    hidden_activation: relu
  num_envs: 1

training:
  total_timesteps: 1000
  checkpoint_freq: 1000

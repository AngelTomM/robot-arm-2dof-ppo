# Experimento PPO_1 (Fase X - Prueba MDP)
# Formulación Markoviana estricta (MDP):
# - success_mode: none (sin terminación anticipada por contacto ni condición de memoria 'hold')
# - reward_type: lyapunov_lqr (función de costo cuadrática continua tipo control óptimo/Lyapunov)
# - Sin términos dependientes de historia ni de zonas artificiales discretas

experiment:
  name: PPO_1
  description: PPO con recompensa continua cuadratica (Lyapunov/LQR) y horizonte fijo sin hold (MDP)
  author: Fase X
  phase: phase_X

# Parámetros del Entorno Físico
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  # Modo de éxito sin memoria interna oculta (episodios de horizonte finito estándar)
  success_mode: none
  success_bonus: 0.0
  reward_type: lyapunov_lqr
  reward_params:
    w_pos: 1.0      # Ponderación del error cartesiano ||p_target - p_ee||^2
    w_vel: 0.05     # Ponderación de disipación de energía cinética ||q_dot||^2
    w_ctrl: 0.01    # Ponderación de esfuerzo de control ||u||^2
    w_v: 0.0        # Desactivada penalización gaussiana de velocidad
    w_a: 0.0        # Desactivada penalización por delta de acción (no depende de prev_action)

normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0

# Hiperparámetros de PPO
ppo:
  batch_size: 64
  clip_range: 0.2
  ent_coef: 0.002
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.00015
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  num_envs: 4

# Hiperparámetros de la red neuronal
  net_arch:
    layers: [256, 256, 128]
    hidden_activation: relu
    # PPO: salida lineal (identity) para la media de la política gaussiana

# Parametros del proceso de entrenamiento
training:
  total_timesteps: 300000
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

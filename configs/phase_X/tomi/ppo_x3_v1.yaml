# Experimento X3 (PPO) — Tomi

experiment:
  name: X3_v1                      # ID del experimento -> carpeta de salida
  description: Arquitectura profunda 256x256 ReLU con batch_size 64 y VecNormalize (obs)
  author: Tomi

# Parámetros del Entorno Físico 
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5                # velocidad angular máxima por junta (rad/s)
  target_radius: 0.06           # radio de la zona objetivo (m)
  max_steps: 200                # pasos por episodio -> duración = max_steps*dt = 10 s
  dt: 0.05                      # periodo de integración (s)
  success_mode: hold            # éxito = mantenerse en el objetivo; el default del env es 'touch' (instantáneo)
  hold_steps: 5                 # pasos consecutivos dentro del objetivo para dar éxito
  velocity_tolerance: 0.3       # velocidad angular conjunta máxima para contar como 'hold'

  reward_type: smooth_precision # (ver metodología)
  reward_params:                # pesos del reward
    distance_penalty_coef: 1.0  # penalización de distancia al objetivo (-coef*dist)
    action_penalty_coef: 0.02   # penalización de |acción| (control económico)
    success_bonus: 15.0         # bono al conseguir éxito
    near_zone_threshold: 0.3    # fracción de distancia que define la 'zona cercana'
    velocity_penalty_near: 0.15 # penalización de velocidad cerca del objetivo (llegar 'quieto')
    w_a: 0                   # penalización de suavidad de acciones
# =============================================================
# Hiperparámetros de PPO (on-policy)
# Regla de multiplicación clave:
#   muestras por actualización = num_envs * n_steps = 4 * 2048 = 8192
#   -> total_timesteps y checkpoint_freq deberían ser múltiplos de 8192
#      (si no, SB3 redondea el presupuesto HACIA ARRIBA al siguiente
#       múltiplo: 200000 termina en 204800 pasos reales)
#   -> batch_size debe dividir a num_envs*n_steps (8192 % 64 = 0;
#      8192/64 = 128 mini-batches por actualización)
# =============================================================
ppo:
  learning_rate: 0.00015        # paso del optimizador Adam (menor = más estable)
  n_steps: 2048                 # pasos por entorno antes de actualizar; 2048*4 = 8192 muestras por update
  batch_size: 64                # tamaño del mini-batch SGD (debe dividir 8192)
  n_epochs: 10                  # épocas sobre el mismo rollout por actualización
  gamma: 0.99                   # factor de descuento (horizonte efectivo ~ 1/(1-gamma) = 100 pasos)
  gae_lambda: 0.95              # GAE: trade-off sesgo/varianza de la ventaja
  clip_range: 0.2               # clip de PPO sobre la probabilidad relativa (estabilidad del update)
  ent_coef: 0.002               # bonus de entropía (exploración; 0 = nada)
  max_grad_norm: 0.5            # clipping de gradiente
  num_envs: 4                   # entornos paralelos (multiplica el rollout)
  net_arch: 256x256_relu        # parser: '<N>x<M>_<activación>' (relu | tanh)

# =============================================================
# Parámetros de Entrenamiento
#   total_timesteps: múltiplo recomendado de num_envs*n_steps (8192)
#   checkpoint_freq: pasos entre snapshots acoplados model.zip +
#     vecnormalize_stats.pkl (múltiplo de num_envs; idealmente de 8192)
#   eval_freq: pasos entre evaluaciones periódicas (múltiplo de num_envs);
#     conviene que divida total_timesteps
# =============================================================
training:
  total_timesteps: 204800       # = 25 updates de 8192
  checkpoint_freq: 49152        # checkpoints alineados a frontera de update (6*8192)
  eval_freq: 20480              # múltiplo de 8192 y de num_envs (evaluación en frontera limpia)
  n_eval_episodes: 15           # episodios por evaluación periódica (más = más señal, más lento)

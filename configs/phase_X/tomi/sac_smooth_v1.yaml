# Experimento SAC: Soft Actor-Critic para Control Continuo Suave
experiment:
  name: "sac_smooth"
  description: "Entrenamiento Off-Policy con SAC para control continuo suave y eficiente en muestras"
  author: "Tomi"

# Parámetros del Entorno Físico
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5           # Velocidad angular controlable
  target_radius: 0.06      # Radio de precisión
  max_steps: 200
  dt: 0.05
  success_mode: hold       # igual que Fase A/B/C (el default del env es 'touch')
  hold_steps: 5            # pasos manteniendo objetivo sin salirse
  velocity_tolerance: 0.3  # tolerancia de velocidad en moda 'hold'
  
  reward_type: "smooth_precision"
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.3
    velocity_penalty_near: 0.15
    w_a: 0.05                   # penalización de suavidad de acciones

# Hiperparámetros de SAC
sac:
  learning_rate: 0.0003
  buffer_size: 100000      # Tamaño del Replay Buffer
  learning_starts: 1000    # Pasos exploratorios iniciales para poblar buffer
  batch_size: 256          # Muestras por gradiente
  tau: 0.005               # Coeficiente Polyak para Target Network
  gamma: 0.99              # Factor de descuento
  ent_coef: "auto"         # Ajuste de entropía automático
  num_envs: 1              # SAC suele entrenar con 1 entorno (Off-policy)

# Parámetros de Entrenamiento
training:
  total_timesteps: 70000  # SAC es sample-efficient; suele converger antes que PPO
  eval_freq: 35000        # (multiplo de num_envs=1; 2 evaluaciones en el presupuesto)
  n_eval_episodes: 10
  checkpoint_freq: 25000  # <- train.py lee 'checkpoint_freq' (no 'save_freq')

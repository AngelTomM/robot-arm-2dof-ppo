# ==============================================================================
# CONFIGURACIÓN UNIFICADA DEL ENTORNO FÍSICO Y MDP (MUJOCO REACHER-V5)
# ==============================================================================
# Fuente Única de Verdad (SSOT) para la planta física dinámica Reacher-v5 de Gymnasium,
# actuadores por torque, restricciones articulares y formulación continua de recompensa.

env:
  # Identificador de planta física
  engine: mujoco
  env_id: Reacher-v5

  # Parámetros cinemáticos y geométricos de los eslabones (m)
  l1: 0.1
  l2: 0.11

  # Parámetros inerciales y de masa (kg)
  mass_link0: 0.035605
  mass_link1: 0.035605
  mass_fingertip: 0.004189

  # Restricciones mecánicas articulares
  joint0_limit_deg: null       # Articulación base continua / ilimitada (-inf, inf)
  joint1_limit_deg: 171.887    # Articulación distal (|theta2| <= 3.0 rad)

  # Espacio de acción y actuadores (N·m)
  action_space: continuous
  action_dim: 2
  torque_limit: 1.0            # Acción normalizada en [-1.0, 1.0]
  gear: 200.0                  # Relación de transmisión de MuJoCo

  # Integración temporal y horizonte de control
  dt: 0.01                     # Paso de integración numérica nativo de MuJoCo (s)
  frame_skip: 2                # Subpasos por ciclo de control (dt_efectivo = 0.02 s, 50 Hz)
  max_steps: 100               # Límite de pasos por episodio (horizonte T = 2.0 s, transitorio + régimen permanente)
  target_radius: 0.02          # Radio cartesiano de tolerancia de estabilización física (m)

  # Formulación MDP continuo
  success_mode: none           # MDP de horizonte fijo sin terminación anticipada
  reward_type: quadratic_lqr   # r_t = - (w_pos*||e_pos||^2 + w_ctrl*||a||^2 + w_vel*||qvel||^2)

  # Ponderaciones calibradas de la función de recompensa cuadrática canónica LQR
  reward_params:
    w_pos: 20.0     #45.0      # Penalización cuadrática de error cartesiano ||p_ee - p_tgt||^2
    w_vel: 0.025    #0.0285    # Amortiguamiento cinético calibrado sobre ||qvel||^2 (evita estrangulamiento transitorio)
    w_ctrl: 0.01    #0.009     # Regularización de esfuerzo de torque ||a_t||^2 en punto Pareto óptimo
    w_v: 0.0                   # Penalización gaussiana de velocidad desactivada
    w_a: 0.0                   # Penalización por variación de acción desactivada


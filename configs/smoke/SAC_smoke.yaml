# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: Smoke Test SAC (Fase D)
# ==============================================================================
experiment:
  description: Smoke test SAC con recompensa Lyapunov / LQR continua (Fase D)

# Referencia al entorno físico común
env_config: configs/environment.yaml

normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0

sac:
  learning_rate: 0.0003
  buffer_size: 50000
  learning_starts: 100
  batch_size: 64
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch:
    layers: [128, 128]
    hidden_activation: relu
  num_envs: 1

training:
  total_timesteps: 1000
  checkpoint_freq: 1000

# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: PPO_14 (Fase D)
# ==============================================================================
# Calibración optimizada para romper el mínimo local de frenado prematuro:
#
# 1. hidden_activation: relu -> No saturante; transmite gradientes íntegros a través
#                               de las 3 capas para sostener el torque hasta el blanco.
# 2. ent_coef: 0.004         -> Mantiene viva la exploración motora; evita el colapso
#                               prematuro de varianza y supera la meseta a 3-5 cm.
# 3. learning_rate: 0.00035  -> Mayor velocidad de adaptación para ajustar las ganancias
#                               de control fino y vencer la inercia sin sobreimpulsos.
# 4. gamma: 0.99             -> Horizonte temporal de 100 pasos (1 / (1 - gamma) = 100),
#                               alineado exactamente con max_steps=100 de environment.yaml.
# 5. norm_reward: true       -> Normalización dinámica de retornos para gradientes vivos cerca de e=0.
# ==============================================================================
experiment:
  description: PPO_14 - Superacion de minimo local y arribo exacto (ReLU, ent_coef=0.004, lr=0.00035, gamma=0.99, norm_reward=true, 500k timesteps)
  phase: phase_D

# Referencia al entorno físico común
env_config: configs/environment.yaml

# Preprocesamiento y normalización
normalization:
  norm_obs: true               # Estandariza escalas de entrada (radianes, velocidades, distancias)
  norm_reward: true            # Normalización dinámica de retornos: gradiente vivo en distancias milimétricas
  clip_obs: 10.0

# Hiperparámetros del algoritmo PPO
ppo:
  learning_rate: 0.00035       # Acelerada para superar el mínimo local y vencer el compromiso de torque
  n_steps: 1024                # Tamaño de rollout por entorno (4096 pasos totales con 4 envs)
  batch_size: 128              # Tamaño de minilote equilibrado (32 minilotes por época)
  n_epochs: 10                 # Épocas de optimización por cada rollout
  gamma: 0.99                  # Factor de descuento alineado al horizonte de 100 pasos: 1 / (1 - 0.99) = 100
  gae_lambda: 0.95             # Factor GAE estándar de compromiso sesgo-varianza
  clip_range: 0.2              # Rango de recorte canónico conservador
  ent_coef: 0.004              # Exploración activa para evitar colapso prematuro de varianza motora
  max_grad_norm: 0.5           # Amortigua gradientes para evitar impulsos bruscos de torque
  num_envs: 4                  # Entornos concurrentes

  net_arch:
    layers: [256, 256, 128]    # Arquitectura profunda de alta expresividad cinemática
    hidden_activation: relu    # No saturante: evita el desvanecimiento de gradiente en posturas distantes

# Parámetros del proceso de entrenamiento
training:
  total_timesteps: 500000      # Presupuesto para consolidar maniobra global y estabilización en el blanco
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

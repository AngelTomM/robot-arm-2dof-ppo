# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: PPO_10_todo (Fase D)
# ==============================================================================
experiment:
  description: PPO integralmente optimizado para precision fina (norm_reward=true, gamma=0.99, ent_coef=0.0, Tanh, lr=3e-4, 500k timesteps)
  phase: phase_D

# Referencia al entorno físico común
env_config: configs/environment.yaml

# Preprocesamiento y normalización
normalization:
  norm_obs: true
  norm_reward: true            # Normalización dinámica de retornos para amplificar gradientes finos cerca del target
  clip_obs: 10.0

# Hiperparámetros del algoritmo PPO (optimizados conjuntamente para posicionamiento fino y régimen permanente)
ppo:
  learning_rate: 0.0003        # Tasa acelerada para superar mesetas y ajustar micro-correcciones
  n_steps: 2048                # Horizonte de muestreo amplio (8192 pasos totales con 4 envs) para reducir varianza GAE
  batch_size: 128              # Tamaño de minilote equilibrado (64 minilotes por época)
  n_epochs: 10                 # Épocas de optimización por rollout
  gamma: 0.99                  # Factor de descuento elevado para priorizar la permanencia terminal sobre el objetivo
  gae_lambda: 0.95             # Factor GAE estándar de reducción de varianza
  clip_range: 0.2              # Rango de recorte canónico PPO
  ent_coef: 0.0                # Entropía nula para permitir varianza cero (sigma -> 0) y suprimir jitter estocástico
  max_grad_norm: 0.5           # Recorte de norma de gradiente
  num_envs: 4                  # Entornos concurrentes

  net_arch:
    layers: [256, 256]
    hidden_activation: tanh    # Activación suave C^inf para control continuo de torque sin zonas muertas

# Parámetros del proceso de entrenamiento
training:
  total_timesteps: 500000      # Presupuesto extendido para consolidar la estabilización asintótica milimétrica
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

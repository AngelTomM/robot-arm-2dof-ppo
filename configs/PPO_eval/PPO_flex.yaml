# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: PPO_flex (Fase D)
# ==============================================================================
# Fenómeno 2: Flexión articular profunda para alcanzar el espacio interior (base/codo).
# Objetivo: El manipulador debe doblar la articulación 2 (theta2 -> +-170°) para
#           alcanzar con el efector final puntos pegados a la base o al codo.
# Modificaciones respecto a PPO_1:
#   - ppo.ent_coef: 0.01               (entropía alta para forzar exploración estocástica de la junta 2)
#   - ppo.net_arch: [256, 256, 128]    (alta capacidad para modelar cinemática no lineal de flexión)
#   - training.total_timesteps: 500000 (presupuesto extendido para asimilar posturas dobladas)
# ==============================================================================
experiment:
  description: PPO_flex - Aislado para flexion interior profunda (ent_coef=0.01, 3 capas [256,256,128], 500k timesteps)
  phase: phase_D

# Referencia al entorno físico común
env_config: configs/environment.yaml

# Preprocesamiento y normalización
normalization:
  norm_obs: true
  norm_reward: false           # Igual a PPO_1 (sin normalización de retornos para aislar el efecto de flexión)
  clip_obs: 10.0

# Hiperparámetros del algoritmo PPO (base PPO_1)
ppo:
  learning_rate: 0.00015       # Igual a PPO_1
  n_steps: 2048                # Igual a PPO_1
  batch_size: 64               # Igual a PPO_1
  n_epochs: 10                 # Igual a PPO_1
  gamma: 0.99                  # Igual a PPO_1
  gae_lambda: 0.95             # Igual a PPO_1
  clip_range: 0.2              # Igual a PPO_1
  ent_coef: 0.01               # Modificado: entropía elevada para evitar colapso de varianza en junta 2
  max_grad_norm: 0.5           # Igual a PPO_1
  num_envs: 4                  # Igual a PPO_1

  net_arch:
    layers: [256, 256, 128]    # Igual a PPO_1 (capacidad no lineal de 3 capas)
    hidden_activation: relu    # Igual a PPO_1

# Parámetros del proceso de entrenamiento
training:
  total_timesteps: 500000      # Modificado: tiempo extra para asimilar trayectorias de flexión profunda
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: PPO_18 (Fase D)
# ==============================================================================
# Calibración híbrida para resolver el repliegue interior en tijera:
#
# 1. learning_rate: 0.0001 (1e-4) -> Tasa calibrada de PPO_7. Otorga al hombro (junta 1)
#                                    la tracción necesaria para vencer la gran inercia I_1
#                                    y rotar el ángulo fino faltante cuando el brazo de
#                                    palanca efectivo es mínimo (r_efectivo ≈ 0.01 m).
# 2. ent_coef: 0.004              -> Exploración activa de PPO_15. Evita el colapso prematuro
#                                    de la varianza motora en geometrías replegadas poco frecuentes.
# 3. gamma: 0.99                  -> Horizonte de planificación de 100 pasos.
# 4. norm_reward: true            -> Normalización dinámica de retornos activa.
# 5. hidden_activation: relu      -> Red profunda [256, 256, 128] no saturante.
# ==============================================================================
experiment:
  description: PPO_18 - Resolucion de singularidad interior (lr=1e-4, ent_coef=0.004, norm_reward=true, gamma=0.99, ReLU)
  phase: phase_D

# Referencia al entorno físico común
env_config: configs/environment.yaml

# Preprocesamiento y normalización
normalization:
  norm_obs: true               # Estandariza escalas de entrada (radianes, velocidades, distancias)
  norm_reward: true            # Normalización dinámica de retornos
  clip_obs: 10.0

# Hiperparámetros del algoritmo PPO
ppo:
  learning_rate: 0.0001        # Tasa equilibrada para permitir rotación del hombro en posturas plegadas
  n_steps: 1024                # Tamaño de rollout por entorno (4096 pasos totales con 4 envs)
  batch_size: 128              # Tamaño de minilote equilibrado (32 minilotes por época)
  n_epochs: 10                 # Épocas de optimización por cada rollout
  gamma: 0.99                  # Factor de descuento alineado al horizonte de 100 pasos
  gae_lambda: 0.95             # Factor GAE estándar de compromiso sesgo-varianza
  clip_range: 0.2              # Rango de recorte canónico conservador
  ent_coef: 0.004              # Exploración activa para posturas de flexión profunda en tijera
  max_grad_norm: 0.5           # Amortigua gradientes para evitar impulsos bruscos de torque
  num_envs: 4                  # Entornos concurrentes

  net_arch:
    layers: [256, 256, 128]    # Arquitectura profunda de alta expresividad cinemática
    hidden_activation: relu    # No saturante: evita el desvanecimiento de gradiente en posturas distantes

# Parámetros del proceso de entrenamiento
training:
  total_timesteps: 500000      # Presupuesto amplio para consolidar el control fino
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

# Experimento S1_smooth_200 (Fase C)
experiment:
  name: S1_smooth_200
  description: Fase C - Piloto SAC ligero (256x256 ReLU, w_a = 0.05, buffer 200k, learning_starts 2000, 200k pasos)
  author: Fase C
  phase: C
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: hold
  hold_steps: 5
  velocity_tolerance: 0.3
  reward_type: smooth_precision
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.3
    velocity_penalty_near: 0.15
    w_a: 0.05
normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
sac:
  learning_rate: 0.0003
  buffer_size: 200000
  learning_starts: 2000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  net_arch: 256x256_relu
  num_envs: 1
training:
  total_timesteps: 20000
  checkpoint_freq: 20000

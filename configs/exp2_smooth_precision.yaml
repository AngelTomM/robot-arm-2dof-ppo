# Experimento 2: Alta Precisión y Suavidad (Evitar sobreimpulsos y oscilaciones)
experiment:
  name: "exp2_smooth_precision"
  description: "Recompensa suave con penalización de velocidad cerca del objetivo y mayor número de pasos"
  author: "Uli/Tomi"

# Parámetros del Entorno Físico
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5           # Velocidad más controlable para evitar pasarse de largo
  target_radius: 0.06      # Radio de precisión más exigente
  max_steps: 200
  dt: 0.05
  # Tipo de función de recompensa: "distance_only", "smooth_precision", "energy_efficient"
  reward_type: "smooth_precision"
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0     # Gran incentivo al alcanzar la meta
    near_zone_threshold: 0.3 # Zona de frenado
    velocity_penalty_near: 0.15 # Penalización por llegar a lo loco

# Hiperparámetros de PPO
ppo:
  learning_rate: 0.00015   # Aprendizaje más fino y estable
  n_steps: 2048            # Trayectorias más largas para evaluar la detención
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  num_envs: 4

# Parámetros de Entrenamiento y Evaluación
training:
  total_timesteps: 300000
  eval_freq: 5000
  n_eval_episodes: 15
  save_freq: 50000

# ==============================================================================
# CONFIGURACIÓN DEL AGENTE: PPO_op (Fase D)
# ==============================================================================
# Fenómeno 3: Tránsito dinámico hacia el cuadrante opuesto (maniobra balística de 180°).
# Objetivo: El manipulador debe rotar ágilmente hacia el lado opuesto del plano
#           sin quedarse frenado a mitad de camino por saturación o pereza motora.
# Modificaciones respecto a PPO_1:
#   - ppo.net_arch.hidden_activation: relu  (no saturante ante distancias grandes e_pos > 0.30 m)
#   - ppo.gamma: 0.99                       (horizonte temporal amplio para justificar el viaje largo)
#   - ppo.learning_rate: 0.0003             (tasa duplicada para generar tracción y pulso de torque)
# ==============================================================================
experiment:
  description: PPO_op - Aislado para transito hacia el cuadrante opuesto (lr=0.0003, gamma=0.99, ReLU no saturante)

# Referencia al entorno físico común
env_config: configs/environment.yaml

# Preprocesamiento y normalización
normalization:
  norm_obs: true
  norm_reward: false           # Igual a PPO_1
  clip_obs: 10.0

# Hiperparámetros del algoritmo PPO (base PPO_1)
ppo:
  learning_rate: 0.0003        # Modificado: mayor velocidad de adaptación para maniobras balísticas rápidas
  n_steps: 2048                # Igual a PPO_1
  batch_size: 64               # Igual a PPO_1
  n_epochs: 10                 # Igual a PPO_1
  gamma: 0.99                  # Igual a PPO_1 (previsión de 100 pasos para recompensar el arribo)
  gae_lambda: 0.95             # Igual a PPO_1
  clip_range: 0.2              # Igual a PPO_1
  ent_coef: 0.002              # Igual a PPO_1
  max_grad_norm: 0.5           # Igual a PPO_1
  num_envs: 4                  # Igual a PPO_1

  net_arch:
    layers: [256, 256, 128]    # Igual a PPO_1
    hidden_activation: relu    # Igual a PPO_1 (garantiza gradientes no nulos en errores espaciales grandes)

# Parámetros del proceso de entrenamiento
training:
  total_timesteps: 300000      # Igual a PPO_1
  checkpoint_freq: 50000
  eval_freq: 5000
  n_eval_episodes: 15

# Configuración Fase B: X5_near con presupuesto extendido a 1M pasos y checkpoints acoplados a VecNormalize
experiment:
  name: "X5_near"
  description: "Fase B - Diagnóstico y Curva de Aprendizaje: X5_near con 1.000.000 de pasos (123 rollouts, 25 checkpoints)"
  author: "Fase B"

env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: "hold"
  hold_steps: 5
  velocity_tolerance: 0.30
  reward_type: "x5_near"
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.30
    velocity_penalty_near: 0.15
    r_near_mode: "none" # Sin bonificación positiva por permanecer cerca

normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0

ppo:
  learning_rate: 0.00015
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  max_grad_norm: 0.5
  num_envs: 4
  net_arch: "256x256_relu"

training:
  total_timesteps: 1000000       # Presupuesto nominal (123 rollouts = 1.007.616 timesteps reales)
  rollout_size: 8192             # num_envs (4) * n_steps (2048)
  checkpoint_rollout_k: 5        # Cada 5 rollouts = 40.960 timesteps
  checkpoint_freq: 40960         # Frecuencia exacta de checkpoints acoplados a VecNormalize
  eval_freq: 5000                # Mantenido de Fase A para PhaseAEvalCallback
  n_eval_episodes: 15

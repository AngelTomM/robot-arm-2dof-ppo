# Regla de Selección de Checkpoint de Fase B (Fijada a priori antes del entrenamiento)
version: "fase_b_v1"
date: "2026-10-08"

budget:
  total_timesteps_nominal: 1000000
  total_timesteps_exact: 1007616       # 123 rollouts * 8192
  rollout_buffer_size: 8192            # num_envs (4) * n_steps (2048)
  checkpoint_step_interval: 40960      # k = 5 rollouts
  expected_checkpoints_count: 25       # 24 intermedios + 1 final
  seeds: [42, 100, 2026]

evaluation_protocol:
  dataset: "validation"                # data/datasets/validation_set_200.json
  n_episodes: 200
  mode: "deterministic"
  strict_criteria:
    target_radius: 0.06
    velocity_tolerance: 0.10
    hold_steps: 20
    max_steps: 200
    dt: 0.05

meseta_rule:
  u_meseta: 0.05                       # 5.0 puntos porcentuales (valor inicial a validar)
  definition: "Variación absoluta de la media entre checkpoints consecutivos < 0.05 durante dos transiciones consecutivas"
  degradation_threshold: -0.05         # Caída > 5 pp se clasifica como degradación
  no_convergence_declaration: "Si la curva sube hasta el final sin cumplir meseta ni degradación: 'No convergió'"

selection_criteria_hierarchy:
  primary: "max_mean_strict_success_rate" # Mayor tasa media de éxito estricto determinista entre las 3 semillas
  tie_break_window: 0.05                  # Candidatos a menos de U_meseta del máximo
  tie_break_1: "min_steps_to_success_median" # Menor mediana de pasos al éxito
  tie_break_2: "min_mean_action_delta"       # Menor media de ||delta_a|| (mayor suavidad)
  single_common_checkpoint: true             # Se elige un único timestep común para las 3 semillas

geometric_episodes_selection:
  dataset: "validation_set_200.json"
  q10_short_radius:
    episode_id: 34
    radius: 0.30965
    description: "Radio corto cerca de la base (Q10)"
  q50_medium_radius:
    episode_id: 195
    radius: 1.09132
    description: "Radio medio en espacio de trabajo típico (Q50)"
  q90_long_radius:
    episode_id: 40
    radius: 1.74570
    description: "Radio largo casi extensión total (Q90)"
  edge_max_radius:
    episode_id: 90
    radius: 1.89945
    description: "Radio máximo cercano a frontera singular de 2.0m"

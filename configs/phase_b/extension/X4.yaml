# Experimento X4 (Fase B_ext)
experiment:
  name: X4
  description: Aumenta batch_size a 256 respecto de X3 (256x256 ReLU, VecNormalize)
  author: Fase A
  phase: B_ext
env:
  l1: 1.0
  l2: 1.0
  max_speed: 1.5
  target_radius: 0.06
  max_steps: 200
  dt: 0.05
  success_mode: hold
  hold_steps: 5
  velocity_tolerance: 0.3
  reward_type: smooth_precision
  reward_params:
    distance_penalty_coef: 1.0
    action_penalty_coef: 0.02
    success_bonus: 15.0
    near_zone_threshold: 0.3
    velocity_penalty_near: 0.15
normalization:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
ppo:
  learning_rate: 0.00015
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  max_grad_norm: 0.5
  num_envs: 4
  net_arch: 256x256_relu
training:
  total_timesteps: 655360
  checkpoint_freq: 40960
  eval_freq: 5000
  n_eval_episodes: 15

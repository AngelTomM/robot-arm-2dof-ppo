# Regla Formal de Selección de Checkpoint y Elección del Mejor Agente
# Fase B (Extensión) — Presupuesto: 655 360 pasos
# Fijada estrictamente antes del entrenamiento
version: "fase_b_ext_v1"
date: "2026-10-12"

budget:
  total_timesteps: 655360              # 80 rollouts * 8192 pasos
  rollout_size: 8192                   # num_envs (4) * n_steps (2048)
  checkpoint_freq: 40960               # cada 5 rollouts
  expected_checkpoints_per_seed: 16    # 16 checkpoints (el último en 655 360)
  seeds: [42, 100, 2026]

evaluation_datasets:
  validation_b2:
    path: "data/datasets/phase_b_ext/validation_b2_500.json"
    n_episodes: 500
    seed: 202611
    role: "Decisiones y selección de checkpoints (B-11)"
  final_b2:
    path: "data/datasets/phase_b_ext/final_b2_500.json"
    n_episodes: 500
    seed: 202622
    role: "Lectura única terminal (B-12). Sellado criptográficamente."

# 4.1 Selección del Checkpoint Ganador por Configuración (Validación B2)
checkpoint_selection_rule_4_1:
  target_dataset: "validation_b2_500.json"
  eval_mode: "deterministic"
  aggregation: "mean_across_3_seeds"   # media de las 3 semillas para principales
  smoothing:
    window_size: 3
    type: "moving_average_truncated_edges"
    formula_start: "s_bar[0] = (s[0] + s[1]) / 2.0"
    formula_interior: "s_bar[k] = (s[k-1] + s[k] + s[k+1]) / 3.0"
    formula_end: "s_bar[15] = (s[14] + s[15]) / 2.0"
  u_equiv:
    definition: "total_wilson_ci_width_at_max"
    sample_size: 500
    confidence_level: 0.95
    note: "Referencia heurística de banda de ruido operacional basada en el ancho binomial del conjunto de validación, no intervalo de confianza formal para la media muestral de 3 semillas correlacionadas (valor inicial a validar)."
  equivalence_criterion: "s_bar[k] >= max(s_bar) - u_equiv"
  tie_break_rule: "earliest_checkpoint" # entre equivalentes, el menor timestep
  single_common_checkpoint: true
  caveat: "El máximo sobre validación sesga al alza; el número reportado es el de Final B2."

# 4.2 Elección del Mejor Agente (Final B2)
agent_selection_rule_4_2:
  target_dataset: "final_b2_500.json"
  eval_mode: "deterministic"
  candidates_scope: ["X1a", "X2", "X3", "X4", "X5", "X5_near", "X6"] # 7 principales
  excluded_from_rule: ["C0", "X1b", "X1c", "X1s", "X2b"]
  primary_metric: "max_mean_strict_success_rate" # media inter-semilla (ddof=1)
  u_equiv_final:
    definition: "total_wilson_ci_width_at_best_mean"
    sample_size: 500
    confidence_level: 0.95
  group_equivalence_rule:
    condition: "top_agent_success - candidate_success < u_equiv_final"
    declaration: "Si dos o más agentes están dentro de u_equiv_final, se declara formalmente un Grupo de Agentes Estadísticamente Equivalentes ('No se distinguen con estos datos')."
    tie_breakers_policy: "Eliminados como imposición de ganador forzado. Las métricas secundarias (desviación entre semillas ddof=1, mediana de pasos al éxito, suavidad ||delta_a||) se reportan exclusivamente como descriptivas y comparativas dentro del grupo."

budget_slope_heuristic:
  threshold_pp: 2.0                    # 2.0 puntos porcentuales (valor inicial a validar)
  definition: "s_mean[step_655360] - s_mean[step_573440] > 0.02 indica pendiente final positiva remanente."
  note: "No declarar meseta ni no convergencia fuera del rango 0–655 360."

geometric_episodes:
  dataset: "validation_b2_500.json"
  q10_short_radius:
    episode_id: 311
    radius: 0.31327
  q50_medium_radius:
    episode_id: 85
    radius: 1.00526
  q90_long_radius:
    episode_id: 167
    radius: 1.72628
  edge_max_radius:
    episode_id: 480
    radius: 1.89916
